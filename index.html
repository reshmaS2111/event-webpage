<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CodeCraft Event</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>CodeCraft 2025</h1>
    <p>Join us for a day of code, creativity, and community!</p>
  </header>

  <section class="event-details">
    <h2>Event Details</h2>
    <ul>
      <li><strong>Date:</strong> August 10, 2025</li>
      <li><strong>Time:</strong> 10:00 AM - 4:00 PM</li>
      <li><strong>Location:</strong> Chennai Tech Park</li>
    </ul>
  </section>

  <section class="register">
    <h2>Register Now</h2>
    <form id="regForm">
      <input type="text" placeholder="Your Name" required>
      <input type="email" placeholder="Your Email" required>
      <button type="submit">Register</button>
    </form>
    <p id="message"></p>
  </section>

  <footer>
    <p>&copy; 2025 CodeCraft Event Team</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
